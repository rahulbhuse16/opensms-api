
name: OpenSMS API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: opensms-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          echo "Starting OpenSMS deployment..."

          mkdir -p /opt/opensms
          umask 077

          echo "Retrieving database configuration..."

          DB_URL=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_URL" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_USERNAME=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_USERNAME" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_PASSWORD=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_PASSWORD" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          install -m 600 /dev/null /opt/opensms/.env

          printf 'DB_URL=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\nSERVER_PORT=8080\n' \
            "\$DB_URL" "\$DB_USERNAME" "\$DB_PASSWORD" \
            > /opt/opensms/.env

          unset DB_PASSWORD

          echo "Logging in to ECR..."

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "Pulling application image..."

          docker pull "$IMAGE_URI"

          echo "Updating application container..."

          docker rm -f opensms-api 2>/dev/null || true

          docker run -d \
            --name opensms-api \
            --restart unless-stopped \
            --env-file /opt/opensms/.env \
            -p 8080:8080 \
            "$IMAGE_URI"

          echo "Checking container status..."

          sleep 10
          docker ps --filter "name=opensms-api"

          echo "OpenSMS deployment command completed."
          EOF
          )

          PARAMETERS=$(jq -cn --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy OpenSMS API $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment polling timed out."
          exit 1
