
name: OpenSMS API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: opensms-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building OpenSMS API image..."

          docker build \
            -f backend/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

          echo "Pushing image to ECR..."

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image pushed successfully."

      # 5. Deploy to EC2 through SSM
      - name: Deploy to EC2 through SSM
        shell: bash
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Preparing OpenSMS deployment..."
          echo "EC2 Instance: $EC2_INSTANCE_ID"
          echo "Image: $IMAGE_URI"

          REMOTE_SCRIPT=$(cat <<EOF
          set -eu

          echo "Starting OpenSMS deployment..."

          mkdir -p /opt/opensms
          umask 077

          echo "Retrieving database configuration..."

          DB_URL=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_URL" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_USERNAME=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_USERNAME" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DB_PASSWORD=\$(aws ssm get-parameter \
            --name "/opensms/prod/DB_PASSWORD" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          install -m 600 /dev/null /opt/opensms/.env

          printf 'DB_URL=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\nSERVER_PORT=8080\n' \
            "\$DB_URL" "\$DB_USERNAME" "\$DB_PASSWORD" \
            > /opt/opensms/.env

          unset DB_PASSWORD

          echo "Logging in to ECR..."

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "Pulling Docker image..."

          docker pull "$IMAGE_URI"

          echo "Removing previous container..."

          docker rm -f opensms-api 2>/dev/null || true

          echo "Starting OpenSMS API..."

          docker run -d \
            --name opensms-api \
            --restart unless-stopped \
            --env-file /opt/opensms/.env \
            -p 8080:8080 \
            "$IMAGE_URI"

          echo "Waiting for application startup..."

          sleep 10

          echo "Container status:"
          docker ps --filter "name=opensms-api"

          echo "Application logs:"
          docker logs --tail 30 opensms-api

          echo "Deployment command completed."
          EOF
          )

          PARAMETERS=$(jq -cn --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          echo "Sending deployment command through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy OpenSMS API $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment..."

          for i in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "Deployment command succeeded."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "TimedOut" ]]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Deployment polling timed out."
          exit 1
